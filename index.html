
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Consulta de precios</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f4f9;
      color: #172033;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
    }
    .panel {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 30px 24px;
      border-radius: 18px;
      box-shadow: 0 8px 30px #00000012;
      text-align: center;
    }
    h1 { margin-top: 0; font-size: 27px; }
    p { color: #647084; line-height: 1.5; }
    button {
      width: 100%;
      padding: 14px;
      margin-top: 18px;
      border: 1px solid #d4d9e2;
      border-radius: 9px;
      background: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background: #f7f8fa; }
    #estado { overflow-wrap: anywhere; font-size: 14px; }
  </style>
</head>
<body>
  <main class="panel">
    <h1>Consulta de precios</h1>
    <p>Ingresá con tu cuenta de Google para identificarte como vendedor.</p>
    <button id="entrar">Continuar con Google</button>
    <button id="salir" hidden>Cerrar sesión</button>
    <p id="estado">Esperando inicio de sesión.</p>
  </main>

  <script type="module">
    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";

    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup,
      signOut,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDmOBSD4DGJr1Lntj3b34ibTwtvN1snwa0",
      authDomain: "consultaprecios-7bc91.firebaseapp.com",
      projectId: "consultaprecios-7bc91",
      storageBucket: "consultaprecios-7bc91.firebasestorage.app",
      messagingSenderId: "717367528010",
      appId: "1:717367528010:web:aee56491d07b4964fbf4b3"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    const entrar = document.getElementById("entrar");
    const salir = document.getElementById("salir");
    const estado = document.getElementById("estado");

    entrar.addEventListener("click", async () => {
      estado.textContent = "Abriendo inicio de sesión...";
      try {
        await signInWithPopup(auth, provider);
      } catch (error) {
        estado.textContent = "No se pudo iniciar sesión: " + error.message;
      }
    });

    salir.addEventListener("click", async () => {
      await signOut(auth);
    });

    onAuthStateChanged(auth, (usuario) => {
      if (usuario) {
        estado.textContent =
          "Sesión iniciada: " + (usuario.email || "cuenta de Google") +
          ". La autorización para consultar precios aún no está configurada.";
        entrar.hidden = true;
        salir.hidden = false;
      } else {
        estado.textContent = "No has iniciado sesión.";
        entrar.hidden = false;
        salir.hidden = true;
      }
    });
  </script>
</body>
</html>
