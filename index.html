<!DOCTYPE html>
<html lang="es">
<head>
  <link rel="manifest" href="/consulta-precio/manifest.json">
  <meta name="theme-color" content="#d94b4b">
  <link rel="apple-touch-icon" href="/consulta-precio/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Precios">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Consulta de precios</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: #f1f4f9;
      color: #172033;
    }

    .panel {
      width: 100%;
      max-width: 440px;
      padding: 28px 24px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 8px 30px #00000012;
    }

    h1 {
      margin-top: 0;
      text-align: center;
      font-size: 26px;
    }

    h2 {
      font-size: 20px;
      overflow-wrap: anywhere;
    }

    p {
      color: #647084;
      line-height: 1.5;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border: 1px solid #d4d9e2;
      border-radius: 9px;
      font-size: 16px;
    }

    input:focus {
      outline: 2px solid #b8d0ff;
      border-color: #175cd3;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 14px;
      border: 0;
      border-radius: 9px;
      background: #175cd3;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    #salir {
      background: #e9edf5;
      color: #172033;
    }

    #cerrarEscaner {
      background: #b42318;
    }

    #estado {
      overflow-wrap: anywhere;
      font-size: 14px;
    }

    #buscador, #resultado {
      margin-top: 22px;
    }

    /* PANEL DE BÚSQUEDA POR NOMBRE */
    #busquedaNombre {
      margin-top: 18px;
      padding: 18px;
      background: #f5f7fb;
      border: 1px solid #e5eaf2;
      border-radius: 12px;
    }

    #busquedaNombre h2 {
      margin-top: 0;
      margin-bottom: 12px;
    }

    #formularioNombre input {
      margin-top: 0;
    }

    #listaProductos {
      margin-top: 10px;
    }

    #listaProductos:empty {
      display: none;
    }

    #listaProductos button {
      margin-top: 8px;
      background: #ffffff;
      border: 1px solid #dfe5ef;
      color: #24334b;
      text-align: left;
      font-weight: normal;
      overflow-wrap: anywhere;
    }

    /* PANEL DE BÚSQUEDA POR CÓDIGO */
    #busquedaCodigo {
      margin-top: 26px;
      padding-top: 22px;
      border-top: 1px solid #dfe4ec;
    }

    #busquedaCodigo > p {
      margin: 0 0 12px;
      font-size: 14px;
    }

    #formulario input {
      margin-top: 0;
    }

    #abrirEscaner {
      background: #ffffff;
      border: 1px solid #d4dce8;
      color: #34445c;
    }

    #resultado {
      padding: 16px;
      border-radius: 12px;
      background: #f5f7fb;
      overflow-wrap: anywhere;
    }

    .precio {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 11px 0;
      border-bottom: 1px solid #dfe4ec;
    }

    .precio:last-child {
      border-bottom: 0;
    }

    .valor {
      font-weight: bold;
      text-align: right;
    }

    #lector {
      width: 100%;
      overflow: hidden;
      border-radius: 10px;
    }

    #lector video {
      width: 100%;
      border-radius: 10px;
    }

    #ayudaEscaner {
      font-size: 13px;
      text-align: center;
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 480px) {
      body {
        padding: 12px;
        align-items: start;
      }

      .panel {
        padding: 24px 18px;
      }
    }
  </style>
</head>

<body>
  <main class="panel">
    <h1>Consulta de precios</h1>

    <p id="estado">Verificando sesión...</p>

    <button id="entrar" type="button">
      Continuar con Google
    </button>

    <section id="buscador" hidden>
      <p>
        Buscá un producto por su nombre o ingresá su código
        de barras para consultar los precios.
      </p>

      <!-- BÚSQUEDA POR NOMBRE -->
      <div id="busquedaNombre">
        <h2>Buscar por nombre</h2>

        <form id="formularioNombre">
          <input
            id="nombreProducto"
            type="text"
            placeholder="Ej.: Samsung, auricular..."
            autocomplete="off"
            minlength="2"
            required
          >

          <button id="buscarNombre" type="submit">
            Buscar producto
          </button>
        </form>

        <div id="listaProductos" aria-live="polite"></div>
      </div>

      <!-- BÚSQUEDA POR CÓDIGO -->
      <div id="busquedaCodigo">
        <p><strong>¿Tenés el código de barras?</strong></p>

        <form id="formulario">
          <input
            id="codigo"
            type="text"
            placeholder="Ingresá el código de barras"
            autocomplete="off"
            required
          >

          <button id="consultar" type="submit">
            Consultar por código
          </button>
        </form>

        <!-- ESCÁNER DE CÓDIGOS -->
        <button id="abrirEscaner" type="button">
          Escanear productos con la cámara
        </button>

        <div id="zonaEscaner" hidden>
          <p id="ayudaEscaner">
            Cámara activa: apuntá al código de barras del producto.
            Después de cada lectura podés escanear el siguiente.
          </p>

          <div id="lector"></div>

          <button id="cerrarEscaner" type="button">
            Cerrar cámara
          </button>
        </div>
      </div>

      <!-- RESULTADO DE LA CONSULTA -->
      <div id="resultado" hidden></div>
    </section>

    <button id="salir" type="button" hidden>
      Cerrar sesión
    </button>
  </main>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <script type="module">
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";

    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup,
      signOut,
      onAuthStateChanged
    } from
      "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDmOBSD4DGJr1Lntj3b34ibTwtvN1snwa",
      authDomain: "consultaprecios-7bc91.firebaseapp.com",
      projectId: "consultaprecios-7bc91",
      storageBucket: "consultaprecios-7bc91.firebasestorage.app",
      messagingSenderId: "717367528010",
      appId: "1:717367528010:web:aee56491d07b4964fbf4b3"
    };

    const API_URL =
      "https://consulta-precios-api.jara-mauricio-jm.workers.dev";

    const auth = getAuth(initializeApp(firebaseConfig));
    const provider = new GoogleAuthProvider();

    const entrar = document.getElementById("entrar");
    const salir = document.getElementById("salir");
    const estado = document.getElementById("estado");
    const buscador = document.getElementById("buscador");

    const formulario = document.getElementById("formulario");
    const codigo = document.getElementById("codigo");
    const consultar = document.getElementById("consultar");
    const resultado = document.getElementById("resultado");

    const formularioNombre =
      document.getElementById("formularioNombre");
    const nombreProducto =
      document.getElementById("nombreProducto");
    const buscarNombre =
      document.getElementById("buscarNombre");
    const listaProductos =
      document.getElementById("listaProductos");

    const abrirEscaner = document.getElementById("abrirEscaner");
    const cerrarEscaner = document.getElementById("cerrarEscaner");
    const zonaEscaner = document.getElementById("zonaEscaner");

    let lectorCodigo = null;
    let escaneoActivo = false;
    let procesandoLectura = false;
    let ultimoCodigoLeido = "";
    let momentoUltimaLectura = 0;
    let numeroConsulta = 0;
    let numeroBusquedaNombre = 0;

    // INICIO DE SESIÓN
    entrar.addEventListener("click", async () => {
      estado.textContent = "Abriendo inicio de sesión...";
      entrar.disabled = true;

      try {
        await signInWithPopup(auth, provider);
      } catch (error) {
        estado.textContent =
          "No se pudo iniciar sesión: " + error.message;
      } finally {
        entrar.disabled = false;
      }
    });

    // CIERRE DE SESIÓN
    salir.addEventListener("click", async () => {
      await detenerEscaner();

      try {
        await signOut(auth);

        resultado.hidden = true;
        resultado.replaceChildren();
        codigo.value = "";
        nombreProducto.value = "";
        listaProductos.replaceChildren();
      } catch (error) {
        estado.textContent = "No se pudo cerrar la sesión.";
      }
    });

    // ESTADO DE AUTENTICACIÓN
    onAuthStateChanged(auth, async (usuario) => {
      if (usuario) {
        estado.textContent =
          "Sesión iniciada: " +
          (usuario.email || "cuenta de Google");

        entrar.hidden = true;
        salir.hidden = false;
        buscador.hidden = false;
      } else {
        await detenerEscaner();

        entrar.hidden = false;
        salir.hidden = true;
        buscador.hidden = true;

        resultado.hidden = true;
        resultado.replaceChildren();
        listaProductos.replaceChildren();

        estado.textContent =
          "Iniciá sesión con tu cuenta de Google.";
      }
    });

    // MOSTRAR PRODUCTO Y SUS TRES PRECIOS
    // Nunca se muestra el precio de costo.
    function mostrarProducto(producto) {
      resultado.replaceChildren();
      resultado.hidden = false;

      const titulo = document.createElement("h2");
      titulo.textContent = producto.producto || "Producto";
      resultado.appendChild(titulo);

      const detalle = document.createElement("p");

      detalle.textContent =
        (producto.codigo
          ? "Código: " + producto.codigo
          : "Sin código") +
        (producto.categoria
          ? " · Categoría: " + producto.categoria
          : "");

      resultado.appendChild(detalle);

      const precios = [
        ["Precio público", producto.publico],
        ["Precio vendedor", producto.vendedor],
        ["Precio gremio", producto.gremio]
      ];

      for (const [etiqueta, valor] of precios) {
        const fila = document.createElement("div");
        fila.className = "precio";

        const nombre = document.createElement("span");
        nombre.textContent = etiqueta;

        const monto = document.createElement("span");
        monto.className = "valor";

        monto.textContent =
          valor !== null &&
          valor !== undefined &&
          valor !== ""
            ? valor
            : "No disponible";

        fila.append(nombre, monto);
        resultado.appendChild(fila);
      }
    }

    // BUSCAR PRODUCTOS POR NOMBRE
    formularioNombre.addEventListener("submit", async (evento) => {
      evento.preventDefault();

      const nombre = nombreProducto.value.trim();

      if (nombre.length < 2) {
        listaProductos.textContent =
          "Escribí al menos 2 letras para buscar.";
        return;
      }

      const busquedaActual = ++numeroBusquedaNombre;

      buscarNombre.disabled = true;
      buscarNombre.textContent = "Buscando...";
      listaProductos.textContent = "Buscando productos...";

      try {
        const usuario = auth.currentUser;

        if (!usuario) {
          throw new Error("Iniciá sesión nuevamente.");
        }

        const idToken = await usuario.getIdToken();

        const respuesta = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            idToken,
            accion: "buscarPorNombre",
            nombre
          })
        });

        const datos = await respuesta.json();

        if (!respuesta.ok || !datos.ok) {
          throw new Error(
            datos.error || "No se pudo buscar."
          );
        }

        // Evitar mostrar resultados de una búsqueda anterior.
        if (busquedaActual !== numeroBusquedaNombre) return;

        listaProductos.replaceChildren();

        if (!Array.isArray(datos.result) || datos.result.length === 0) {
          listaProductos.textContent =
            "No se encontraron productos.";
          return;
        }

        const aviso = document.createElement("p");
        aviso.textContent =
          "Resultados encontrados: " +
          datos.result.length +
          ". Seleccioná un producto.";
        listaProductos.appendChild(aviso);

        for (const producto of datos.result) {
          const boton = document.createElement("button");
          boton.type = "button";

          boton.textContent =
            producto.producto +
            (producto.categoria
              ? " · " + producto.categoria
              : "") +
            (producto.codigo
              ? " · Código: " + producto.codigo
              : " · Sin código");

          boton.addEventListener("click", () => {
            mostrarProducto(producto);
            estado.textContent =
              "Producto seleccionado: " + producto.producto;
          });

          listaProductos.appendChild(boton);
        }

      } catch (error) {
        if (busquedaActual === numeroBusquedaNombre) {
          listaProductos.textContent =
            error.message || "Ocurrió un error al buscar.";
        }
      } finally {
        if (busquedaActual === numeroBusquedaNombre) {
          buscarNombre.disabled = false;
          buscarNombre.textContent = "Buscar producto";
        }
      }
    });

    // ABRIR LA CÁMARA
    abrirEscaner.addEventListener("click", async () => {
      if (!auth.currentUser) {
        estado.textContent =
          "Primero iniciá sesión con Google.";
        return;
      }

      if (!window.Html5Qrcode) {
        estado.textContent =
          "No se pudo cargar el lector. Revisá tu conexión.";
        return;
      }

      if (escaneoActivo || lectorCodigo) return;

      abrirEscaner.disabled = true;
      zonaEscaner.hidden = false;
      estado.textContent = "Preparando la cámara...";
      procesandoLectura = false;
      ultimoCodigoLeido = "";
      momentoUltimaLectura = 0;

      try {
        lectorCodigo = new Html5Qrcode("lector", {
          formatsToSupport: [
            Html5QrcodeSupportedFormats.EAN_13,
            Html5QrcodeSupportedFormats.EAN_8,
            Html5QrcodeSupportedFormats.UPC_A,
            Html5QrcodeSupportedFormats.UPC_E,
            Html5QrcodeSupportedFormats.CODE_128,
            Html5QrcodeSupportedFormats.CODE_39,
            Html5QrcodeSupportedFormats.ITF
          ],
          verbose: false
        });

        await lectorCodigo.start(
          { facingMode: "environment" },
          {
            fps: 15,
            qrbox: (ancho, alto) => {
              const anchoCaja = Math.min(ancho * 0.95, 420);
              const altoCaja = Math.min(alto * 0.55, 220);

              return {
                width: Math.floor(anchoCaja),
                height: Math.floor(altoCaja)
              };
            },
            aspectRatio: 16 / 9
          },

          // SE EJECUTA CUANDO SE LEE UN CÓDIGO
          async (codigoLeido) => {
            const valorLeido = codigoLeido.trim();
            const ahora = Date.now();

            if (!valorLeido || procesandoLectura) return;

            // Ignorar lecturas repetidas del mismo producto.
            if (
              valorLeido === ultimoCodigoLeido &&
              ahora - momentoUltimaLectura < 2500
            ) {
              return;
            }

            procesandoLectura = true;
            ultimoCodigoLeido = valorLeido;
            momentoUltimaLectura = ahora;
            codigo.value = valorLeido;

            estado.textContent =
              "Código leído. Consultando precios...";

            // La cámara permanece abierta.
            formulario.requestSubmit();
          },

          // No mostrar errores de cada fotograma sin lectura.
          () => {}
        );

        escaneoActivo = true;
        estado.textContent =
          "Cámara activa. Escaneá el primer producto.";

      } catch (error) {
        console.error("Error al abrir la cámara:", error);
        await detenerEscaner();

        const nombreError = error?.name || "Error desconocido";
        const mensajeError = error?.message || "Sin detalles";

        estado.textContent =
          "Error de cámara (" + nombreError + "): " + mensajeError;

        console.error("Detalle del error:", {
          nombre: nombreError,
          mensaje: mensajeError,
          seguro: window.isSecureContext,
          mediaDevicesDisponible: !!navigator.mediaDevices
        });
      }
    });

    // CERRAR LA CÁMARA MANUALMENTE
    cerrarEscaner.addEventListener("click", async () => {
      await detenerEscaner();

      estado.textContent = auth.currentUser
        ? "Cámara cerrada. Podés ingresar otro código."
        : "Iniciá sesión con tu cuenta de Google.";
    });

    // DETENER EL ESCÁNER
    async function detenerEscaner() {
      const lectorAnterior = lectorCodigo;
      const estabaActivo = escaneoActivo;

      lectorCodigo = null;
      escaneoActivo = false;
      procesandoLectura = false;

      if (lectorAnterior) {
        try {
          if (estabaActivo) {
            await lectorAnterior.stop();
          }
        } catch (error) {
          console.warn(
            "No se pudo detener normalmente la cámara.",
            error
          );
        }

        try {
          await lectorAnterior.clear();
        } catch (error) {
          console.warn("No se pudo limpiar el lector.", error);
        }
      }

      zonaEscaner.hidden = true;
      abrirEscaner.disabled = false;
    }

    // CONSULTA DE PRECIOS POR CÓDIGO DE BARRAS
    formulario.addEventListener("submit", async (evento) => {
      evento.preventDefault();

      const codigoIngresado = codigo.value.trim();
      if (!codigoIngresado) return;

      const consultaActual = ++numeroConsulta;

      consultar.disabled = true;
      consultar.textContent = "Consultando...";
      resultado.hidden = false;
      resultado.textContent = "Buscando producto...";

      try {
        const usuario = auth.currentUser;

        if (!usuario) {
          throw new Error("Iniciá sesión nuevamente.");
        }

        const idToken = await usuario.getIdToken();

        const respuesta = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            idToken,
            codigo: codigoIngresado
          })
        });

        const datos = await respuesta.json();

        if (!respuesta.ok || !datos.ok) {
          throw new Error(
            datos.error || "No se pudo realizar la consulta."
          );
        }

        // Evitar mostrar resultados de una consulta anterior.
        if (consultaActual !== numeroConsulta) return;

        const producto = datos.result;

        if (!producto || !producto.encontrado) {
          resultado.textContent =
            "No se encontró un producto con ese código.";
          return;
        }

        mostrarProducto(producto);

        if (escaneoActivo) {
          estado.textContent =
            "Producto encontrado. Podés escanear el siguiente.";
        }

      } catch (error) {
        if (consultaActual === numeroConsulta) {
          resultado.textContent =
            error.message ||
            "Ocurrió un error al consultar el producto.";
        }
      } finally {
        if (consultaActual === numeroConsulta) {
          consultar.disabled = false;
          consultar.textContent = "Consultar por código";
        }

        // Permitir otra lectura aunque la cámara siga abierta.
        procesandoLectura = false;
      }
    });
  </script>

  <!-- REGISTRO DE LA APLICACIÓN PWA -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/consulta-precio/sw.js")
          .catch((error) => {
            console.error(
              "Error al registrar la aplicación:",
              error
            );
          });
      });
    }
  </script>
</body>
</html>
